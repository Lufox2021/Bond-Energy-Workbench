<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bond Energy Workbench</title>
<style>
:root{
  --ink:#1f2933; --muted:#5f6b7a; --line:#d9dee5; --bg:#f6f7f9; --card:#fff;
  --accent:#b4441b; --accent2:#1c5d99; --ok:#2b7a3d; --okbg:#e8f5ea; --bad:#b42318; --badbg:#fdecea;
  --hot:#d9480f; --cold:#1c7ed6; --warn:#8a5a00; --warnbg:#fff4d6;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45}
header{background:#2a1f1a;color:#fff;padding:14px 22px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:22px;letter-spacing:.2px}
header .sub{color:#f3c9a8;font-size:14px}
nav{display:flex;gap:4px;background:#3a2c25;padding:0 16px}
nav button{background:none;border:0;color:#e9d8cc;padding:11px 16px;font-size:15px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:#f08c4b;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:18px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:16px;margin:16px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 14px;font-size:14px;cursor:pointer}
button.btn:hover{filter:brightness(1.08)}
button.btn.alt{background:#fff;color:var(--accent);border:1px solid var(--accent)}
button.btn.blue{background:var(--accent2)}
button.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .n{opacity:.7;margin-left:4px}
select,input[type=text]{font-size:15px;padding:6px 8px;border:1px solid #b8c0cc;border-radius:6px;background:#fff}
input.num{width:140px;font-family:ui-monospace,Consolas,monospace}
input.ok{border-color:var(--ok);background:var(--okbg)}
input.bad{border-color:var(--bad);background:var(--badbg)}
.problem{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media (max-width:860px){.problem{grid-template-columns:1fr}}
.ptext{font-size:16.5px}
.pid{font-size:12px;color:var(--muted);margin-bottom:6px}
.scene svg{width:100%;height:auto;display:block;background:#fbfaf8;border:1px solid var(--line);border-radius:8px}
.decode{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.decode{grid-template-columns:1fr}}
.q{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fcfcfd}
.q.okq{border-color:#9fd3a9;background:#f4fbf5}
.q.badq{border-color:#f0b3ad;background:#fff8f7}
.q h4{margin:0 0 6px;font-size:14.5px}
.q label{display:block;padding:2px 0;font-size:14.5px;cursor:pointer}
.q .fb{margin-top:6px}
table.givens{border-collapse:collapse;width:auto}
table.givens td:first-child{min-width:230px}
table.givens td{padding:4px 6px;border-bottom:1px solid #eef0f3;font-size:14.5px;vertical-align:middle}
table.givens td.u{color:var(--muted);white-space:nowrap}
table.givens td.m{width:22px;text-align:center}
.fb{font-size:14px;border-radius:6px;padding:6px 10px;margin-top:6px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.rule{background:var(--warnbg);color:#5a3d00}
.fb:empty{display:none}
.mini{font-size:12.5px;color:var(--bad)}
.plan{background:#f3f6fb;border-left:4px solid var(--accent2);padding:8px 14px;border-radius:4px;margin-top:10px}
.plan ol{margin:4px 0 0 18px;padding:0}
.step{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:#fff}
.step.done{border-color:#9fd3a9;background:#f8fcf8}
.step .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.step .lbl{font-weight:600}
.step .sym{font-family:Georgia,serif;font-size:16px;min-width:46px}
.worked{font-family:Georgia,serif;font-size:15px;color:#24382a;margin-top:6px}
.summary{border:2px solid var(--ok);border-radius:10px;padding:12px 16px;background:#f6fbf6}
.big{font-size:20px;font-family:Georgia,serif}
.score{display:flex;gap:16px;font-size:14px}
.score b{font-size:18px}
table.ref{border-collapse:collapse;font-size:14px}
table.ref th,table.ref td{border:1px solid var(--line);padding:4px 10px;text-align:left}
table.ref th{background:#f1f3f6}
.eqn{font-family:Georgia,serif;font-size:17px;background:#fbf7f3;border:1px solid #ecdcd0;border-radius:6px;padding:6px 12px;display:inline-block;margin:4px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.callout{background:var(--warnbg);border:1px solid #f0d58a;border-radius:8px;padding:8px 12px;margin:8px 0}
textarea.copy{width:100%;height:160px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
table.up{border-collapse:collapse;font-size:13px;width:100%}
table.up td,table.up th{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#eef0f3;color:#3b4552}
.tag.exo{background:#fde8dd;color:#a33a0b}.tag.endo{background:#e0efff;color:#1b5fa8}
details summary{cursor:pointer;color:var(--accent2)}
kbd{font-family:ui-monospace,Consolas,monospace;background:#eef0f3;border-radius:3px;padding:0 4px}
table.cyc{border-collapse:collapse;width:100%}
table.cyc td,table.cyc th{padding:5px 8px;border-bottom:1px solid #eef0f3;font-size:14.5px;text-align:left;vertical-align:middle}
table.cyc th{font-size:13px;color:var(--muted);font-weight:600}
table.cyc td.proc{font-family:Georgia,serif;font-size:15px}
input.mult{width:64px;text-align:center;font-family:ui-monospace,Consolas,monospace}
.datalist{margin:8px 0 0;padding:8px 12px;background:#f7f8fa;border:1px solid var(--line);border-radius:8px;font-size:15px;columns:2;column-gap:24px}
.datalist div{break-inside:avoid;padding:1px 0}
.diag svg{width:100%;height:auto;display:block;background:#fbfaf8;border:1px solid var(--line);border-radius:8px}
.legend{font-size:13px;margin-top:6px;columns:2;column-gap:20px}
.legend div{break-inside:avoid}
.unk{color:var(--accent);font-weight:600}
.work{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:14px;align-items:start}
@media (max-width:1000px){.work{grid-template-columns:1fr}}
.sticky{position:sticky;top:10px}
.eqbig{font-family:Georgia,serif;font-size:18px;background:#fbf7f3;border:1px solid #ecdcd0;border-radius:6px;padding:8px 14px;display:inline-block}
.eqn2{font-family:Georgia,serif;font-size:16px}
table.steps{border-collapse:collapse;width:100%}
table.steps td,table.steps th{padding:6px 8px;border-bottom:1px solid #eef0f3;text-align:left;vertical-align:middle;font-size:14.5px}
table.steps th{font-size:13px;color:var(--muted);font-weight:600}
.cancel{text-decoration:line-through;color:#9aa3ad}
.good{color:var(--ok)} .badc{color:var(--bad);font-weight:600}
.sumbox{background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:10px}
.sumbox .lab{font-size:12.5px;color:var(--muted);margin-top:4px}
label.rev{display:inline-flex;gap:4px;align-items:center;font-size:14px;cursor:pointer;white-space:nowrap}
pre.struct{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:13.5px;line-height:1.15;margin:4px 0 0;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto}
.mols{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.mol{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fcfcfd}
.mol .nm{font-size:13px;color:var(--muted)}
table.bt{border-collapse:collapse;font-size:13px;width:100%}
table.bt td{padding:2px 6px;border-bottom:1px solid #eef0f3}
table.bt td.v{text-align:right;font-family:ui-monospace,Consolas,monospace}
table.cnt{border-collapse:collapse}
table.cnt th,table.cnt td{padding:5px 8px;border-bottom:1px solid #eef0f3;text-align:center;font-size:14.5px}
table.cnt th{font-size:13px;color:var(--muted)}
table.cnt td:first-child,table.cnt th:first-child{text-align:left}
input.cnt{width:52px;text-align:center;font-family:ui-monospace,Consolas,monospace}
.caveat{background:#fff4d6;border:1px solid #f0d58a;border-left:5px solid #e0a800;border-radius:8px;padding:9px 14px;margin:10px 0;font-size:14.5px}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;max-width:560px;margin-top:8px}
.bar{height:14px;border-radius:3px}
</style>
</head>
<body>
<header><h1>Bond Energy Workbench</h1><span class="sub">Estimate ΔH from average bond energies · bonds broken − bonds formed</span></header>
<nav id="nav">
  <button data-tab="review">Review</button>
  <button data-tab="coach" class="on">Coaching</button>
  <button data-tab="test">Testing</button>
  <button data-tab="instr">Instructor</button>
</nav>
<main>
  <section id="tab-review" class="tab"></section>
  <section id="tab-coach" class="tab on"></section>
  <section id="tab-test" class="tab"></section>
  <section id="tab-instr" class="tab"></section>
</main>
<script>
/* Bond Energy Workbench — engine (no DOM; runs in Node for tests) */
var BEE = (function () {
  'use strict';

  // Average bond energies, kJ/mol (gas phase). C=O in CO2 is listed separately.
  var BONDS = [
    ['H–H', 432], ['H–F', 565], ['H–Cl', 427], ['H–Br', 363], ['H–I', 295],
    ['C–H', 413], ['C–C', 347], ['C=C', 614], ['C≡C', 839], ['C–N', 305], ['C=N', 615], ['C≡N', 891],
    ['C–O', 358], ['C=O', 745], ['C=O (in CO₂)', 799], ['C≡O', 1072], ['C–F', 485], ['C–Cl', 339], ['C–Br', 276], ['C–I', 240],
    ['N–H', 391], ['N–N', 160], ['N=N', 418], ['N≡N', 941], ['N–O', 201], ['N=O', 607],
    ['O–H', 467], ['O–O', 146], ['O=O', 495],
    ['F–F', 154], ['Cl–Cl', 239], ['Br–Br', 193], ['I–I', 149]
  ];
  var BE = {}; BONDS.forEach(function (b) { BE[b[0]] = b[1]; });
  function normBond(s) { return String(s).trim().replace(/-/g, '–').replace(/#/g, '≡').replace(/\s*\(in CO2\)/i, ' (in CO₂)'); }

  // Molecule library (gas phase). struct: plain-text structural formula, lone pairs not shown.
  var MOLS = {
    H2: { name: 'hydrogen', bonds: { 'H–H': 1 }, dHf: 0, struct: 'H – H' },
    F2: { name: 'fluorine', bonds: { 'F–F': 1 }, dHf: 0, struct: 'F – F' },
    Cl2: { name: 'chlorine', bonds: { 'Cl–Cl': 1 }, dHf: 0, struct: 'Cl – Cl' },
    Br2: { name: 'bromine (gas)', bonds: { 'Br–Br': 1 }, dHf: 30.9, struct: 'Br – Br' },
    O2: { name: 'oxygen', bonds: { 'O=O': 1 }, dHf: 0, struct: 'O = O' },
    N2: { name: 'nitrogen', bonds: { 'N≡N': 1 }, dHf: 0, struct: 'N ≡ N' },
    HF: { name: 'hydrogen fluoride', bonds: { 'H–F': 1 }, dHf: -273.3, struct: 'H – F' },
    HCl: { name: 'hydrogen chloride', bonds: { 'H–Cl': 1 }, dHf: -92.3, struct: 'H – Cl' },
    HBr: { name: 'hydrogen bromide', bonds: { 'H–Br': 1 }, dHf: -36.3, struct: 'H – Br' },
    H2O: { name: 'water (gas)', bonds: { 'O–H': 2 }, dHf: -241.8, struct: 'H – O – H' },
    H2O2: { name: 'hydrogen peroxide (gas)', bonds: { 'O–H': 2, 'O–O': 1 }, dHf: -136.3, struct: 'H – O – O – H' },
    NH3: { name: 'ammonia', bonds: { 'N–H': 3 }, dHf: -45.9, struct: 'H – N – H\n    |\n    H' },
    N2H4: { name: 'hydrazine (gas)', bonds: { 'N–N': 1, 'N–H': 4 }, dHf: 95.4, struct: 'H – N – N – H\n    |   |\n    H   H' },
    CH4: { name: 'methane', bonds: { 'C–H': 4 }, dHf: -74.6, struct: '    H\n    |\nH – C – H\n    |\n    H' },
    C2H6: { name: 'ethane', bonds: { 'C–C': 1, 'C–H': 6 }, dHf: -84.0, struct: '    H   H\n    |   |\nH – C – C – H\n    |   |\n    H   H' },
    C3H8: { name: 'propane', bonds: { 'C–C': 2, 'C–H': 8 }, dHf: -103.8, struct: '    H   H   H\n    |   |   |\nH – C – C – C – H\n    |   |   |\n    H   H   H' },
    C8H18: { name: 'octane (gas)', bonds: { 'C–C': 7, 'C–H': 18 }, dHf: -208.6, struct: '    H   H   H   H   H   H   H   H\n    |   |   |   |   |   |   |   |\nH – C – C – C – C – C – C – C – C – H\n    |   |   |   |   |   |   |   |\n    H   H   H   H   H   H   H   H' },
    C2H4: { name: 'ethylene', bonds: { 'C=C': 1, 'C–H': 4 }, dHf: 52.4, struct: 'H       H\n  \\   /\n   C = C\n  /   \\\nH       H' },
    C2H2: { name: 'acetylene', bonds: { 'C≡C': 1, 'C–H': 2 }, dHf: 227.4, struct: 'H – C ≡ C – H' },
    CO2: { name: 'carbon dioxide', bonds: { 'C=O (in CO₂)': 2 }, dHf: -393.5, struct: 'O = C = O' },
    CO: { name: 'carbon monoxide', bonds: { 'C≡O': 1 }, dHf: -110.5, struct: 'C ≡ O' },
    CH3OH: { name: 'methanol (gas)', bonds: { 'C–H': 3, 'C–O': 1, 'O–H': 1 }, dHf: -201.0, struct: '    H\n    |\nH – C – O – H\n    |\n    H' },
    C2H5OH: { name: 'ethanol (gas)', bonds: { 'C–C': 1, 'C–H': 5, 'C–O': 1, 'O–H': 1 }, dHf: -234.8, struct: '    H   H\n    |   |\nH – C – C – O – H\n    |   |\n    H   H' },
    CH3Cl: { name: 'chloromethane', bonds: { 'C–H': 3, 'C–Cl': 1 }, dHf: -81.9, struct: '    H\n    |\nH – C – Cl\n    |\n    H' },
    C2H5Cl: { name: 'chloroethane', bonds: { 'C–C': 1, 'C–H': 5, 'C–Cl': 1 }, dHf: -112.1, struct: '    H   H\n    |   |\nH – C – C – Cl\n    |   |\n    H   H' },
    CCl4: { name: 'carbon tetrachloride (gas)', bonds: { 'C–Cl': 4 }, dHf: -95.7, struct: '     Cl\n     |\nCl – C – Cl\n     |\n     Cl' },
    CH2O: { name: 'formaldehyde', bonds: { 'C–H': 2, 'C=O': 1 }, dHf: -108.6, struct: 'H\n  \\\n   C = O\n  /\nH' },
    HCN: { name: 'hydrogen cyanide', bonds: { 'C–H': 1, 'C≡N': 1 }, dHf: 135.1, struct: 'H – C ≡ N' }
  };
  function fhtml(f) { return String(f).replace(/(\d+)/g, '<sub>$1</sub>'); }

  // ---------- numbers ----------
  function parseNum(s) {
    var v = String(s === undefined || s === null ? '' : s).trim().replace(/[−–]/g, '-').replace(/,/g, '').replace(/\s+/g, '').replace(/^\+/, '');
    return /^-?(\d+\.?\d*|\.\d+)$/.test(v) ? parseFloat(v) : NaN;
  }
  // Safe arithmetic: numbers, + − × ÷ * / ·, x between numbers, parentheses, unary minus. No eval().
  function evalExpr(str) {
    var s = String(str === undefined || str === null ? '' : str).replace(/[\u2212\u2013\u2014]/g, '-').replace(/[×·xX]/g, '*').replace(/÷/g, '/').replace(/,/g, '').replace(/\s+/g, '');
    if (s === '') return NaN;
    var i = 0;
    function peek() { return s[i]; }
    function number() { var m = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); }
    function factor() {
      var c = peek();
      if (c === '+') { i++; return factor(); }
      if (c === '-') { i++; return -factor(); }
      if (c === '(') { i++; var v = expr(); if (peek() !== ')') throw 0; i++; return v; }
      return number();
    }
    function term() {
      var v = factor();
      while (peek() === '*' || peek() === '/' || peek() === '(') {
        if (peek() === '(') { v = v * factor(); continue; } // 2(413) means 2 × 413
        var op = s[i++], r = factor(); v = op === '*' ? v * r : v / r;
      }
      return v;
    }
    function expr() { var v = term(); while (peek() === '+' || peek() === '-') { var op = s[i++], r = term(); v = op === '+' ? v + r : v - r; } return v; }
    try { var v = expr(); if (i !== s.length || !isFinite(v)) return NaN; return v; } catch (e) { return NaN; }
  }
  function isExpr(str) { return /[-+*/×÷·xX()\u2212\u2013]/.test(String(str).trim().replace(/^[-\u2212+]/, '')); }
  function fmt(x) { var r = Math.round(x * 10) / 10; if (Math.abs(r) < 1e-9) r = 0; return String(r).replace('-', '−'); }
  function sgn(x) { return (x > 0 ? '+' : '') + fmt(x); }
  function within(v, t, tol) { return isFinite(v) && Math.abs(v - t) <= Math.max(tol.abs || 0, Math.abs(t) * (tol.rel || 0)) + 1e-9; }
  var TOL = { abs: 1, rel: 0.002 };
  var LEVELS = { 1: 'Diatomic molecules', 2: 'Small organic reactions', 3: 'Combustion', 4: 'Multiple bonds & nitrogen' };

  // ---------- reactions ----------
  function parseReaction(str, lib) {
    lib = lib || MOLS;
    var parts = String(str).replace(/→|=>/g, '->').split('->');
    if (parts.length !== 2) throw new Error('use one arrow (->)');
    function side(s) {
      return s.split(/\s\+\s/).map(function (t) {
        var m = /^\s*(\d+)?\s*([A-Za-z0-9]+)\s*(?:\(g\))?\s*$/.exec(t);
        if (!m) throw new Error('can’t read “' + t.trim() + '”');
        if (!lib[m[2]]) throw new Error(m[2] + ' is not in the molecule library');
        return { c: m[1] ? +m[1] : 1, f: m[2] };
      });
    }
    var L = side(parts[0]), R = side(parts[1]);
    // atom balance
    var bal = {};
    function atoms(f) { var a = {}, re = /([A-Z][a-z]?)(\d*)/g, m; while ((m = re.exec(f))) if (m[1]) a[m[1]] = (a[m[1]] || 0) + (m[2] ? +m[2] : 1); return a; }
    L.forEach(function (t) { var a = atoms(t.f); for (var e in a) bal[e] = (bal[e] || 0) - t.c * a[e]; });
    R.forEach(function (t) { var a = atoms(t.f); for (var e in a) bal[e] = (bal[e] || 0) + t.c * a[e]; });
    var unb = Object.keys(bal).filter(function (e) { return bal[e] !== 0; });
    return { L: L, R: R, unbalanced: unb };
  }
  function eqHTML(r) {
    var side = function (s) { return s.map(function (t) { return (t.c > 1 ? t.c : '') + fhtml(t.f) + '(g)'; }).join(' + '); };
    return side(r.L) + ' → ' + side(r.R);
  }
  function bondEnergyOf(bonds) { var s = 0; for (var b in bonds) s += bonds[b] * BE[b]; return s; }

  function solve(p, lib) {
    lib = lib || MOLS;
    var r = parseReaction(p.reaction, lib);
    if (r.unbalanced.length) throw new Error('reaction isn’t balanced (' + r.unbalanced.join(', ') + ')');
    var species = [];
    r.L.concat(r.R).forEach(function (t) { if (species.indexOf(t.f) < 0) species.push(t.f); });
    var types = [];
    species.forEach(function (f) { Object.keys(lib[f].bonds).forEach(function (b) { if (types.indexOf(b) < 0) types.push(b); }); });
    types.sort(function (a, b) { return BONDS.findIndex(function (x) { return x[0] === a; }) - BONDS.findIndex(function (x) { return x[0] === b; }); });
    var sideE = function (s) { return s.reduce(function (a, t) { return a + t.c * bondEnergyOf(lib[t.f].bonds); }, 0); };
    var broken = sideE(r.L), formed = sideE(r.R), est = broken - formed;
    var meas = r.R.reduce(function (a, t) { return a + t.c * lib[t.f].dHf; }, 0) - r.L.reduce(function (a, t) { return a + t.c * lib[t.f].dHf; }, 0);
    // totals of each bond type broken/formed (for worked lines)
    function tally(s) { var o = {}; s.forEach(function (t) { var b = lib[t.f].bonds; for (var k in b) o[k] = (o[k] || 0) + t.c * b[k]; }); return o; }
    var tb = tally(r.L), tf = tally(r.R);
    var line = function (o) { return Object.keys(o).map(function (k) { return o[k] + ' × ' + k + ' (' + BE[k] + ')'; }).join(' + '); };
    var noCoef = function (s) { return s.reduce(function (a, t) { return a + bondEnergyOf(lib[t.f].bonds); }, 0); };
    // C=O value slip

      '<div class="card"><h2>Chemical energy is stored in bonds</h2><p>The <b>bond energy</b> is the energy needed to break one mole of a particular bond in gas-phase molecules. Breaking a bond always takes energy (positive); forming the same bond releases the same amount.</p>' +
      '<p>In a reaction, the reactant bonds break and the product bonds form. So:</p><div class="eqn">ΔH<sub>rxn</sub> ≈ Σ BE(bonds broken) − Σ BE(bonds formed)</div>' +
      '<ul><li>If the product bonds are stronger than the reactant bonds, more energy comes out than goes in: ΔH &lt; 0, exothermic.</li><li>If the reactant bonds are stronger: ΔH &gt; 0, endothermic.</li></ul></div>' +
      '<div class="card"><h2>Why the result is an estimate</h2><p>A C–H bond in methane is not exactly as strong as a C–H bond in ethanol or in chloroform. Tables list an <b>average</b> taken over many molecules. That’s why the table has a separate value for C=O in CO₂ (799 kJ/mol) and a general C=O value (745 kJ/mol).</p>' +

  function csvCell(v) { v = v === undefined || v === null ? '' : String(v); return /[",\n\t]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function toCSV(rows) { return B.COLUMNS.join(',') + '\n' + rows.map(function (r) { return B.COLUMNS.map(function (c) { return csvCell(r[c]); }).join(','); }).join('\n') + '\n'; }
  function parseTable(text) {
    var delim = text.split('\n')[0].indexOf('\t') >= 0 ? '\t' : ',', rows = [], row = [], cell = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true; else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    rows = rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); }); if (!rows.length) return [];
    var head = rows[0].map(function (h) { return h.trim(); });
    return rows.slice(1).map(function (r) { var o = {}; head.forEach(function (h, k) { var v = (r[k] || '').replace(/^\s+|\s+$/g, ''); if (v !== '') o[h] = v; }); return o; });
  }
  function offerFile(name, text, mime, box) {
